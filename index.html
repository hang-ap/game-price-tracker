<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>香港 Game 價紀錄器 (極簡扁平版)</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Game 價紀錄">
    
    <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>

    <div id="loadingOverlay">
        <div class="brand-logo-shape">🎮</div>
        <div class="loading-text">TODU GAME</div>
        <div class="loading-dots">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
        </div>
    </div>

    <header class="app-header">
        <div class="header-user-badge">
            <div class="avatar">🎮</div>
            <div class="user-info">
                <span class="welcome">Welcome Back</span>
                <span class="username">Game Master</span>
            </div>
        </div>
        <h1 class="app-main-title">GAME PRICE</h1>
    </header>

    <div class="segmented-control-container">
        <div class="segmented-control">
            <button class="segment-btn active" id="btnTabPrice" onclick="switchTab('price')">格價中</button>
            <button class="segment-btn" id="btnTabBought" onclick="switchTab('bought')">已購入</button>
            <button class="segment-btn" id="btnTabSettings" onclick="switchTab('settings')">系統設定</button>
        </div>
    </div>

    <div class="search-container" id="searchContainer">
        <input type="text" id="searchBar" placeholder="🔍 搜尋遊戲名稱..." oninput="renderGames()">
    </div>

    <div class="view-toggle-container" id="viewToggleArea">
        <button class="view-btn" id="btnListView" onclick="setViewMode('list')">☰ 條列模式</button>
        <button class="view-btn" id="btnGridView" onclick="setViewMode('grid')">🎴 網格圖鑑</button>
    </div>

    <main class="app-content-area">
        <div id="gameList"></div>
        <div id="emptyTips" class="empty-tips">
            <div class="empty-icon">📭</div>
            <p>未有任何紀錄</p>
            <span>撳右下角加號按鈕開始格價啦！</span>
        </div>

        <div id="settingsPage">
            <div class="settings-group-title">系統顯示模式</div>
            <div class="settings-group card-flat">
                <div class="settings-row">
                    <span class="settings-label">深淺色主題切換</span>
                    <button class="view-btn active" id="themeToggleBtn" onclick="toggleTheme()">🌙 Dark Mode</button>
                </div>
            </div>

            <div class="settings-group-title">數據安全防護</div>
            <div class="settings-group card-flat">
                <div class="settings-row">
                    <span class="settings-label">備份當前本地數據</span>
                    <button class="action-pill-btn accent" onclick="openBackupModal()">💾 匯出備份</button>
                </div>
                <div class="settings-row">
                    <span class="settings-label">導入備份還原名單</span>
                    <button class="action-pill-btn warning" onclick="openRestoreModal()">🔄 匯入還原</button>
                </div>
            </div>
        </div>
    </main>

    <div class="bottom-action-bar" id="bottomActionBar">
        <button id="fabBtn" onclick="openAddModal()">＋ Add New Record</button>
    </div>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <div class="form-btns-top">
                <button type="button" class="btn-text cancel" onclick="closeModal()">取消</button>
                <h3 id="modalTitle">編輯資料</h3>
                <button type="button" class="btn-text confirm" onclick="handleFormSubmit()">完成</button>
            </div>

            <form id="gameForm" onsubmit="event.preventDefault();">
                <div class="modal-body" id="modalBody">
                    <input type="hidden" id="editIndex" value="">

                    <div class="form-group">
                        <label>遊戲名稱</label>
                        <input type="text" id="gName" required placeholder="例如：魔物獵人 荒野" onfocus="hideCustomKeyboard()" oninput="updateScraperLinks()">
                        <div class="scraper-shortcuts">
                            <a id="lnkGoogle" class="btn-shortcut" target="_blank" href="#">🔍 Google 本地搜尋捷徑</a>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>封面圖片網址 (可留空)</label>
                        <input type="url" id="gCover" placeholder="https://example.com/image.png" onfocus="hideCustomKeyboard()">
                    </div>

                    <div class="form-group">
                        <label>庫存狀態標記</label>
                        <select id="gIsBought" onfocus="hideCustomKeyboard()">
                            <option value="false">🔍 格價中 (未購入)</option>
                            <option value="true">📦 已買在庫 (已收藏)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>價格紀錄（點擊價錢欄位可喚起輸入法）</label>
                        <div id="dynamicPriceArea"></div>
                        <button type="button" class="btn-add-price-row" onclick="addPriceRowWithScroll('switch', '一手', '', '')">＋ 新增價格欄位</button>
                    </div>

                    <button type="button" class="btn-main-submit" id="btnMainSubmit" onclick="handleFormSubmit()">💾 儲存所有修改項目</button>
                </div>
            </form>

            <div class="custom-keyboard" id="customKeyboard">
                <button type="button" class="key" ontouchstart="handleKeyPress(event, '1')">1</button>
                <button type="button" class="key" ontouchstart="handleKeyPress(event, '2')">2</button>
                <button type="button" class="key" ontouchstart="handleKeyPress(event, '3')">3</button>
                <button type="button" class="key action-key delete-key" ontouchstart="handleKeyPress(event, 'BACK')">⌫</button>
                
                <button type="button" class="key" ontouchstart="handleKeyPress(event, '4')">4</button>
                <button type="button" class="key" ontouchstart="handleKeyPress(event, '5')">5</button>
                <button type="button" class="key" ontouchstart="handleKeyPress(event, '6')">6</button>
                <button type="button" class="key action-key done-key" ontouchstart="handleKeyDone(event)">完成<br>🔽</button>
                
                <button type="button" class="key" ontouchstart="handleKeyPress(event, '7')">7</button>
                <button type="button" class="key" ontouchstart="handleKeyPress(event, '8')">8</button>
                <button type="button" class="key" ontouchstart="handleKeyPress(event, '9')">9</button>
                
                <button type="button" class="key" style="grid-column: span 3;" ontouchstart="handleKeyPress(event, '0')">0</button>
                <button type="button" class="key action-key clear-key" ontouchstart="handleKeyPress(event, 'CLEAR')">C</button>
            </div>
        </div>
    </div>

    <div id="backupModal" class="modal">
        <div class="modal-content" style="height: auto; max-height: 85vh;">
            <div class="form-btns-top">
                <span style="width:50px;"></span>
                <h3 id="backupModalTitle">數據防護安全中心</h3>
                <button type="button" class="btn-text cancel" onclick="closeBackupModal()">關閉</button>
            </div>
            <div style="padding-bottom:20px;">
                <textarea id="backupTextarea" placeholder="備庫字串區域..."></textarea>
                <button type="button" id="btnCopyBackup" class="btn-main-submit" onclick="copyBackupData()">📋 一鍵複製數據字串</button>
                <button type="button" id="btnConfirmRestore" class="btn-main-submit" style="background-color:var(--danger-color);" onclick="confirmRestoreData()">⚠️ 確認導入覆蓋數據</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=1.0"></script>
</body>
</html>
