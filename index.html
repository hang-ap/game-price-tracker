<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>香港 Game 價紀錄器 (鍵盤修正版)</title>
    <style>
        :root { --keyboard-bg: #2c2c2e; --key-bg: #3a3a3c; --text-color: #ffffff; --accent-color: #007aff; --danger-color: #ff3b30; }
        
        /* 核心修復：鍵盤絕對定位與 Grid 排版 */
        .custom-keyboard { 
            background: var(--keyboard-bg); 
            padding: 15px; 
            padding-bottom: calc(15px + env(safe-area-inset-bottom)); 
            display: none; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            border-top: 1px solid #444; 
            position: fixed; /* 修正：鎖定在視窗底部 */
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 2000;
        }
        .key { background: var(--key-bg); color: var(--text-color); border: none; border-radius: 8px; padding: 15px 0; font-size: 1.2rem; cursor: pointer; }
        .key:active { background: #555; }
        .key.action-key { background: #48484a; }
        .key.delete-key { background: var(--danger-color); }
        .key.done-key { background: var(--accent-color); grid-row: span 2; }
    </style>
</head>
<body>

    <div class="custom-keyboard" id="customKeyboard">
        <button type="button" class="key" onclick="handleKeyPress('1')">1</button>
        <button type="button" class="key" onclick="handleKeyPress('2')">2</button>
        <button type="button" class="key" onclick="handleKeyPress('3')">3</button>
        <button type="button" class="key action-key delete-key" onclick="handleKeyPress('BACK')">⌫</button>
        
        <button type="button" class="key" onclick="handleKeyPress('4')">4</button>
        <button type="button" class="key" onclick="handleKeyPress('5')">5</button>
        <button type="button" class="key" onclick="handleKeyPress('6')">6</button>
        <button type="button" class="key action-key done-key" onclick="hideCustomKeyboard()">完成</button>
        
        <button type="button" class="key" onclick="handleKeyPress('7')">7</button>
        <button type="button" class="key" onclick="handleKeyPress('8')">8</button>
        <button type="button" class="key" onclick="handleKeyPress('9')">9</button>
        
        <button type="button" class="key" style="grid-column: span 3;" onclick="handleKeyPress('0')">0</button>
        <button type="button" class="key action-key" onclick="handleKeyPress('CLEAR')">Clear</button>
    </div>

    <script>
        // 鍵盤邏輯
        function handleKeyPress(val) {
            if (!currentActivePriceInput) return;
            if (val === 'BACK') {
                currentActivePriceInput.value = currentActivePriceInput.value.slice(0, -1);
            } else if (val === 'CLEAR') {
                currentActivePriceInput.value = '';
            } else {
                currentActivePriceInput.value += val;
            }
        }

        function hideCustomKeyboard() {
            document.getElementById('customKeyboard').style.display = 'none';
        }
    </script>
</body>
</html>
